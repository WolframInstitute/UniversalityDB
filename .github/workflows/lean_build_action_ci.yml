name: Lean Build Action

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Cache elan toolchains
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain') }}

      - name: Cache Lake build
        uses: actions/cache@v6
        with:
          path: Lean/.lake
          key: lake-build-${{ runner.os }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lake-manifest.json', 'Lean/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Cache Rust toolchain and cargo registry (for nanoda)
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: cargo-nanoda-${{ runner.os }}

      - name: Install elan
        run: |
          if ! command -v elan &> /dev/null; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build project
        working-directory: Lean
        run: lake build

      - name: Build umbrella module (for leanchecker)
        working-directory: Lean
        run: lake env lean -o .lake/build/lib/lean/UniversalityDB.olean UniversalityDB.lean

      - name: Build umbrella module for nanoda (native_decide-free subset)
        working-directory: Lean
        run: lake env lean -o .lake/build/lib/lean/NanodaSafe.olean NanodaSafe.lean

      # Fork of https://github.com/leanprover/lean-action/ which enables `nanoda-modules` input
      # The fork also tracks the debug-branch/NDJSON incompatibility:
      # https://github.com/leanprover/lean-action/issues/169
      - uses: petr-kratochvil/lean-action@master
        with:
          lake-package-directory: Lean
          build: "false"
          leanchecker: "true"
          nanoda: "true"
          nanoda-allow-sorry: "false"
          # Without `nanoda-modules`, nanoda would check the module auto-detected
          # from the package name in `lakefile.lean` («UniversalityDB»), which pulls
          # in the allowed native_decide usages that nanoda would reject. Scope it
          # to the native_decide-free subset instead (see NanodaSafe.lean).
          nanoda-modules: "NanodaSafe"
          use-github-cache: "false"